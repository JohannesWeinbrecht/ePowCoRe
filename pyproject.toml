[project]
name = "epowcore"
version = "0.1.0"
description = "A converter between different power system model formats and a generic data format."
requires-python = "==3.10.0"
authors = [
    {name = "KIT-IAI-ESA"},
]
license = {text = ""}
dependencies = [
    "dataclasses",
    "geojson",
    "networkx",
    "matplotlib",
    "scipy",
    "pyyaml",
    "pandapower==3.5.3"
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "mypy",
    "sphinx",
    "sphinx_rtd_theme",
    "pylint",
    "isort",
    "pre-commit",
]
simscape = [
    "matlabengine==9.13.9",
]

[tool.setuptools.packages.find]
include = ["epowcore", "epowcore.*"]

[tool.setuptools]
py-modules = ["epowcore"]
zip-safe = false

[tool.uv]
package = true